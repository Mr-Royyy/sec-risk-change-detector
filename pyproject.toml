[project]
name = "sec-risk-change-detector"
version = "0.1.0"
description = "SEC filing NLP project for detecting changes in corporate risk disclosures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "scikit-learn>=1.4.0",
    
]

[project.scripts]
sec-risk = "sec_risk_detector.cli:main"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

